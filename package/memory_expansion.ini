; Memory Expansion for Vampire: The Masquerade - Bloodlines
; Set an option to 0 and restart the game to switch it off. memory_expansion.log (next to this
; file) says what was done.

[D3D9]
; Create the game's Direct3D device as Direct3D 9Ex and keep textures, vertex and index buffers
; in video memory only. Normally Direct3D keeps a second copy of every texture and mesh inside the
; game's 4 GB address space; with this on that copy is gone, and when video memory is full Windows
; moves the data to system RAM outside the game's address space.
d3d9ex = 1
; Vertex and index buffers too (0: keep them in system memory, as before but without the managed copy).
offload_buffers = 1
; Upload buffers kept for reuse when the game updates textures, in MB.
staging_cache_mb = 16
; Run even when d3d9.dll in the game folder is not Windows' own (DXVK, ReShade, dgVoodoo).
; DXVK already keeps textures out of the address space by itself, so this stays 0 for it.
allow_d3d9_wrapper = 0

[Engine]
; The engine's hunk holds the map and, in what is left, its sound and model cache. The game sizes it
; to half the RAM but at most 200 MB; a map that does not fit ends the game with "Hunk_Alloc: failed".
; This raises the 200 MB cap (MB, 200-1024; 0 keeps the game's own sizing). -heapsize on the command
; line still wins.
hunk_mb = 0

[Split]
; EXPERIMENTAL. Run the game's server (the world: characters, AI, physics, Python scripts) in a second
; Vampire.exe with its own 4 GB of address space; the game you see (rendering, sound, interface) keeps
; this one. The game starts that process itself (no window), sends New Game, Load and Save to it, and
; plays on it through the engine's own network code on this PC only. Needs Bin\shaderapiempty.dll.
; If the second process cannot start, the game runs as before. Set to 0 to disable.
enabled = 1
; UDP port of that process on this PC (the first free one from here).
port = 27115
; World frames a second in that process (its fps_max). 100 keeps walking as smooth as in one process
; at the Unofficial Patch's 65 frames a second; if you raised the game's fps_max above 100, raise this
; to match it.
server_fps = 100

[Diagnostics]
; Address-space statistics in the log every N seconds (0 = never).
stats_seconds = 60
; Log every allocation of at least N MB with the code that made it (0 = off; for finding memory hogs).
trace_allocs_mb = 0
; Copy the game's console to game_console.log next to this file (the server process always writes
; server_console.log).
console_log = 0
